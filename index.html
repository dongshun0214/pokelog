<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokeLog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#a8c8ea">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>PokeLog</title>
<style>
:root{
  --font:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --menu-bg:rgba(207,106,135,.5);
  --menu-fg:#fff;
  --top:calc(env(safe-area-inset-top) + 12px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:100lvh;overflow:hidden;font-family:var(--font);color:#2b2f45;background:#8fb8e0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:relative;height:100vh;height:100lvh}
button{font-family:inherit;cursor:pointer}

/* ---------- 背景 ---------- */
#bg{position:absolute;left:0;top:0;width:100%;height:100vh;height:100lvh;overflow:hidden;background:#eef4fb}
#bgHome,#bgPage{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center center;background-repeat:no-repeat;transition:opacity .25s}
#bgHome{background-image:url(home.jpg)}
#bgPage{background-image:url(bg2.jpg)}
body[data-page="home"] #bgPage{opacity:0}
body:not([data-page="home"]) #bgPage{opacity:.5}
body:not([data-page="home"]) #bgHome{opacity:0}
#veil{position:absolute;inset:0;background:rgba(255,255,255,.18);opacity:0;transition:opacity .25s;pointer-events:none}
body:not([data-page="home"]) #veil{opacity:0}

/* ---------- 首頁 ---------- */
#home{position:absolute;inset:0;display:none;pointer-events:none}
body[data-page="home"] #home{display:block}
#home h1{
  position:absolute;left:0;right:0;top:26%;margin:0;text-align:center;
  font-family:"Fredoka","Baloo 2","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Varela Round",sans-serif;font-weight:700;font-size:clamp(52px,19vw,92px);letter-spacing:2px;
  color:#4a5fc8;
  -webkit-text-stroke:8px #fff;paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(255,255,255,.9),0 4px 10px rgba(58,63,158,.25);
}

#home h1 span{display:inline-block}
#homeEv{position:absolute;left:50%;top:84%;transform:translateY(-50%);pointer-events:auto;cursor:pointer;border:0;border-radius:999px;padding:8px 14px;background:var(--c,rgba(255,255,255,.7));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:54px;max-width:94vw;text-align:center;box-shadow:0 2px 10px rgba(40,60,40,.15);line-height:1.3}
#homeMon{position:absolute;left:0;top:84%;transform:translateY(-50%);display:flex;align-items:center;justify-content:flex-end;pointer-events:none}
#homeMon img{max-width:100%;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(40,60,40,.25))}
#homeMon:not(.on){display:none}
#homeEv.lt{color:#4a4020;text-shadow:none}
#homeEv .evL1{font-size:14px;font-weight:800}
#homeEv .evL{font-size:13px}
#homeEv div{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#homeEv:empty{display:none}
/* ---------- 寶貝球與選單 ---------- */
#ballBtn{
  position:absolute;top:var(--top);width:52px;height:52px;padding:0;border:0;border-radius:50%;background:none;z-index:30;
  box-shadow:0 2px 5px rgba(0,0,0,.25);
}
#ballBtn svg{width:100%;height:100%;display:block}
body[data-page="home"] #ballBtn{right:48px;top:calc(var(--top) + 88px)}
body:not([data-page="home"]) #ballBtn{left:22px}

#scrim{position:absolute;inset:0;z-index:20;display:none}
#scrim.on{display:block}
#menu{
  position:absolute;top:calc(var(--top) + 26px);width:76px;z-index:25;
  background:var(--menu-bg);color:var(--menu-fg);
  border-radius:38px;padding:34px 0 12px;text-align:center;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transform:translateY(-10px) scaleY(.92);transform-origin:top;
  transition:opacity .18s,transform .18s;
}
body[data-page="home"] #menu{right:36px;top:calc(var(--top) + 114px)}
body:not([data-page="home"]) #menu{left:10px}
#menu.on{opacity:1;pointer-events:auto;transform:none}
#menu .item{display:block;width:100%;padding:11px 0;border:0;background:none;color:inherit;font-size:15px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)}
#menu.light .item{text-shadow:none}
#menu .item.cur{text-decoration:underline;text-underline-offset:5px}
#menu .cloud{display:block;margin:10px auto 0;width:32px;height:22px;border:0;background:none;padding:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
#menu .cloud svg{width:100%;height:100%}

/* ---------- 子頁面 ---------- */
#page{position:absolute;left:0;top:0;width:100%;height:100vh;height:100dvh;display:none;flex-direction:column;padding-top:var(--top)}
body:not([data-page="home"]) #page{display:flex}
.head{display:flex;align-items:center;gap:10px;padding:0 22px 0 92px;height:52px;flex:none;position:relative}
.addBtn.rk{position:absolute;top:50%;margin-top:-20px;left:calc(30px + (100% - 54px) * 7 / 12 - 20px)}
.head h2{margin:0;font-size:30px;font-weight:800;flex:1;color:#1f2340;letter-spacing:1px}
.modeBox{position:relative}
.modeBox::before{content:"";position:absolute;left:10px;top:50%;margin-top:-5px;border:7px solid transparent;border-top:9px solid #8d93a8;border-bottom:0;pointer-events:none}
.modeBox select{max-width:46vw;text-overflow:ellipsis;
  appearance:none;-webkit-appearance:none;border:0;border-radius:8px;background:rgba(214,226,245,.92);
  font-family:inherit;font-size:16px;font-weight:700;color:#1f2340;padding:9px 16px 9px 32px;
}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:20px 12px 10px;flex:none}
.chip{
  height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.55);padding:0;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  font-size:10px;font-weight:700;line-height:1.1;transition:opacity .15s,border-color .15s;
  text-shadow:0 1px 1px rgba(0,0,0,.3);
}
.chip svg{width:15px;height:15px;display:block;margin-bottom:1px}
.chips.filtering .chip{opacity:.3}
.chips.filtering .chip.sel{opacity:1;border:4px solid rgba(0,0,0,.5)}
.list{flex:1;overflow-y:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.row{display:grid;grid-template-columns:34px 74px 1fr 86px;gap:4px;margin-bottom:4px}
.cell{background:var(--c);color:#fff;min-height:78px;border-radius:6px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.rank{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.photo{display:flex;align-items:center;justify-content:center;padding:3px}
.photo img{width:100%;height:100%;max-height:72px;object-fit:contain;display:block}
.photo .noimg{font-size:26px;opacity:.6}
.info{padding:6px 6px;font-size:12px;line-height:1.3;display:flex;flex-direction:column;justify-content:center;min-width:0}
.info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .nm{font-size:14px;font-weight:800}
.own{display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.35;padding:0 4px}
.own .plus{display:flex;align-items:center;justify-content:center;line-height:0}
.own .ck{width:24px;height:24px;flex:none;margin-right:5px}
.own .st div{white-space:nowrap}
.addRow{display:grid;grid-template-columns:46px 1fr;margin-top:8px}
.addBtn{width:40px;height:40px;border-radius:50%;border:3px solid rgba(0,0,0,.5);background:rgba(255,255,255,.6);color:rgba(0,0,0,.5);justify-self:center;font-size:26px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;color:#555b72;padding:26px 10px;font-size:14px;line-height:1.7}
.shell{flex:1;display:flex;align-items:center;justify-content:center;color:#555b72;font-size:16px;padding-bottom:80px}

/* ---------- 極巨戰表格 ---------- */
.row.max{grid-template-columns:34px 1fr 1fr 80px}
.row.max .rank{font-size:22px}
.cell.mx{padding:5px 4px;text-align:center;font-size:11.5px;line-height:1.4;display:flex;flex-direction:column;align-items:center;min-width:0;min-height:116px}
.cell.mx.blank{background:none;text-shadow:none}
.mx .mph{width:100%;height:58px;display:flex;align-items:center;justify-content:center}
.mx .mph img{max-width:100%;max-height:58px;object-fit:contain;display:block}
.mx .mph .noimg{font-size:26px;opacity:.6}
.mx .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx div{max-width:100%}
.ownMax{display:grid;grid-template-rows:1fr 1fr;gap:4px;min-height:116px}
.half{background:var(--c);color:#fff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.5;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.half.blank{background:none}
.half .ln{display:flex;align-items:center;justify-content:center;gap:3px;font-weight:700}
.half .ln .ck{width:17px;height:17px;margin:0}
.half .plus{display:flex;align-items:center;justify-content:center;line-height:0}
/* ---------- 日曆 ---------- */
.evTop{flex:none;padding:20px 12px 0}
.evCards{padding-top:0;min-height:110px}
.cal{margin:0 0 14px;padding:10px 8px 6px;border-radius:18px;background:rgba(255,255,255,.72)}
.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px}
.calHead b{font-size:18px;color:#1f2340}
.calBtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.07);font-size:22px;line-height:1;color:#1f2340;padding:0}
.wkHead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:#6b7186;padding:2px 0 4px}
.wkRow{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;align-content:start;min-height:56px;padding-bottom:6px;border-top:1px solid rgba(0,0,0,.07)}
.dn{grid-row:1;text-align:center;font-size:14px;color:#1f2340;padding:4px 0 2px}
.dn.out{opacity:.35}
.dn span{display:inline-block;min-width:24px;line-height:24px;border-radius:12px}
.dn span.today{background:#2b2f45;color:#fff;font-weight:700}
.bar{height:8px}
.bar.s{border-top-left-radius:4px;border-bottom-left-radius:4px;margin-left:2px}
.bar.e{border-top-right-radius:4px;border-bottom-right-radius:4px;margin-right:2px}
.evCard{background:var(--c);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.evCard.lt{color:#4a4020;text-shadow:none}
.evPh{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center}
.evPh img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.evTx{min-width:0}
.evL1{font-size:15px;font-weight:800}
.evL{font-size:14px;margin-top:2px;word-break:break-word}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d7dcea;padding:0}
.swb.on{box-shadow:0 0 0 3px rgba(0,0,0,.5)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:12px;padding:11px;font-size:16px;font-weight:700;background:#e9edf8;color:#1f2340}
.seg button.on{background:#5b6bd6;color:#fff}

/* ---------- PokeAPI 搜尋 ---------- */
.f input[type=search]{-webkit-appearance:none;appearance:none}
.pkRes{margin-top:4px;border-radius:10px;overflow:hidden;background:#f3f5fb}
.pkRes:empty{display:none}
.pkrow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid #e6e9f4;background:none;padding:11px 12px;font-size:15px;color:#1f2340;text-align:left}
.pkrow:last-child{border-bottom:0}
.pkn{color:#8d93a8;font-size:12px;min-width:42px}
.pke{color:#8d93a8;font-size:12px;margin-left:auto}
.pkmsg{padding:10px 12px;font-size:13px;color:#6b7186}
.pkSt{font-size:13px;color:#5b6bd6;margin-top:4px}
.pkSt:empty{display:none}
.sheetWrap.top{align-items:flex-start}
.sheetWrap.top .sheet{border-radius:0 0 22px 22px;padding-top:calc(env(safe-area-inset-top) + 18px)}
.monThumb{width:38px;height:38px;object-fit:contain;flex:none}
/* ---------- 搜尋 / 屬性表 ---------- */
.sbar{position:relative;padding:0 12px 10px;flex:none}
.sbar svg{position:absolute;left:25px;top:11px;width:18px;height:18px;pointer-events:none}
.sbar input{width:100%;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.78);padding:0 14px 0 38px;font-family:inherit;font-size:16px;color:#1f2340;-webkit-appearance:none;appearance:none;outline:none}
.sbar input::placeholder{color:#8d93a8}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:3px;margin-bottom:4px}
.thwrap{flex:none;padding:20px 12px 0}
.tlistbox{padding-top:0}
.thead{font-size:13px;font-weight:700;color:#3a3f5c;text-align:center;padding:0 0 2px}
.tcell{border-radius:6px;min-height:40px}
.tname{background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);padding:4px 0}
.tname svg{width:16px;height:16px}
.tlist{background:rgba(255,255,255,.72);display:flex;flex-wrap:wrap;gap:3px;align-content:center;padding:4px}
.tp.hit{outline:2px solid rgba(0,0,0,.5);outline-offset:1px}
.fbtn{border:0;border-radius:8px;background:rgba(214,226,245,.92);font-family:inherit;font-size:15px;font-weight:700;color:#1f2340;padding:9px 14px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn.on{background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5) inset}
.tp{color:#fff;font-size:10px;font-weight:700;line-height:1;padding:4px 5px;border-radius:9px;text-shadow:0 1px 1px rgba(0,0,0,.3);white-space:nowrap}
.tnone{color:#8d93a8;padding:0 4px}
/* ---------- 底部表單 ---------- */
.sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(20,25,50,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 12px;font-size:20px;color:#1f2340}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:13px;color:#6b7186;margin-bottom:4px}
.f input,.f select{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #d7dcea;border-radius:10px;background:#fafbff;color:#1f2340}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2 .f{min-width:0}
.f input[type=date],.f input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:46px;text-align:left;display:block}
.f input::-webkit-date-and-time-value{text-align:left}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f3 .f{min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;margin:4px 0 10px}
.chk input{width:22px;height:22px}
.photoPick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photoPick .pv{width:72px;height:72px;border-radius:12px;background:#eef1fa;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#98a0b8;font-size:12px}
.photoPick .pv img{width:100%;height:100%;object-fit:contain}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;background:#e9edf8;color:#1f2340}
.btn.main{background:#5b6bd6;color:#fff}
.btn.del{background:#fde8e8;color:#c0392b}
.btns{display:flex;gap:10px;margin-top:8px}
.btns .btn{flex:1}
.note{font-size:13px;color:#6b7186;line-height:1.6;margin:0 0 12px}
</style>
</head>
<body data-page="home">

<div id="bg"><div id="bgHome"></div><div id="bgPage"></div><div id="veil"></div></div>

<div id="home"><h1><span id="ttl"><span id="tPo">Po</span><span id="tKe">keLog</span></span></h1><div id="homeMon"><img id="homeMonImg" alt=""></div><button id="homeEv" type="button" aria-label="前往活動頁面"></button></div>
<div id="page"></div>

<button id="ballBtn" aria-label="主選單"></button>
<div id="scrim"></div>
<div id="menu"></div>
<div id="sheetRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= 資料（IndexedDB，容量大；舊的 localStorage 資料會自動搬過去） ================= */
const KEY='pokelog_v1';
let DB={team:[],max:[],events:[]};
let ready=false;
function normalize(d){
  if(!d||!Array.isArray(d.team))return null;
  return{team:d.team,max:Array.isArray(d.max)?d.max:[],
    events:Array.isArray(d.events)?d.events.map(e=>e&&e.color==='#c9a227'?Object.assign(e,{color:'#f1d26a'}):e):[]};
}
function lsLoad(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return null}}
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('no idb'));
    const r=indexedDB.open('pokelog',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  })},
  get(k){return new Promise((res,rej)=>{const q=IDB.db.transaction('kv').objectStore('kv').get(k||'db');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  put(v,k){return new Promise((res,rej)=>{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k||'db');t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
};
async function initDB(){
  let d=null;
  try{IDB.db=await IDB.open();d=normalize(await IDB.get())}catch(e){IDB.db=null}
  if(!d){
    const ls=lsLoad();
    if(ls){d=ls;if(IDB.db){try{await IDB.put(d);localStorage.removeItem(KEY)}catch(e){}}}
  }
  if(d)DB=d;
  ready=true;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
function save(){
  if(!ready){alert('資料還在載入，請稍等一下再試');return}
  if(IDB.db){IDB.put(DB).catch(()=>alert('儲存失敗，可能是手機空間不足。請先匯出備份。'));return}
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('儲存失敗，可能是瀏覽器空間不足。請先匯出備份。')}
}

/* ================= 屬性 ================= */

// 每 6 天為一輪，6 顆各出現一次（順序每輪打亂），所以連續兩天一定不同顆
function ballPerm(c){
  const r=rng(c*7919+13),p=[0,1,2,3,4,5];
  for(let i=5;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  return p;
}
function dailyIndex(){
  const d=new Date(),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  const c=Math.floor(n/6),pos=n-c*6,p=ballPerm(c);
  if(p[0]===ballPerm(c-1)[5])[p[0],p[1]]=[p[1],p[0]];
  return p[pos];
}

/* ================= PokeAPI：名單搜尋、屬性、官方插畫 ================= */
const PK={list:null,map:null,loading:null,info:{}};
const PK_CSV=['https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/','https://cdn.jsdelivr.net/gh/PokeAPI/pokeapi@master/data/v2/csv/'];
const PK_ART=id=>['https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+id+'.png','https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/'+id+'.png'];
async function fetchT(url,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||20000);
  try{return await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}
}
async function fetchAny(urls,kind){
  for(const u of urls){
    try{const r=await fetchT(u);if(r.ok)return kind==='json'?await r.json():kind==='blob'?await r.blob():await r.text()}catch(e){}
  }
  throw new Error('fetch failed');
}
function csvRows(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
// 形態（超級進化、超極巨化、地區形態、原始回歸）：由 pokemon.csv 的非預設形態組出名稱
const PK_KW={mega:['Mega','Mega'],gmax:['超極巨化','Gigantamax'],alola:['阿羅拉','Alolan'],galar:['伽勒爾','Galarian'],hisui:['洗翠','Hisuian'],paldea:['帕底亞','Paldean'],primal:['原始回歸','Primal']};
async function pkFetchForms(species,zhId,enId){
  const pk=csvRows(await fetchAny(PK_CSV.map(b=>b+'pokemon.csv'))),h=pk[0]||[];
  const iId=h.indexOf('id'),iIdent=h.indexOf('identifier'),iSp=h.indexOf('species_id'),iDef=h.indexOf('is_default');
  if(iId<0||iIdent<0||iSp<0||iDef<0)throw new Error('format');
  const rows=pk.slice(1),defIdent={};
  rows.forEach(r=>{if(r[iDef]==='1')defIdent[r[iSp]]=r[iIdent]});
  // 官方在地化名稱（有就優先用，沒有就用我組的）
  const off={};
  try{
    const fr=csvRows(await fetchAny(PK_CSV.map(b=>b+'pokemon_forms.csv'))),fh=fr[0]||[],fi=fh.indexOf('id'),fp=fh.indexOf('pokemon_id');
    const f2p={};fr.slice(1).forEach(r=>{f2p[r[fi]]=r[fp]});
    const nr=csvRows(await fetchAny(PK_CSV.map(b=>b+'pokemon_form_names.csv'))),nh=nr[0]||[];
    const ni=nh.indexOf('pokemon_form_id'),nl=nh.indexOf('local_language_id'),nn=nh.indexOf('pokemon_name');
    if(fi>=0&&fp>=0&&ni>=0&&nl>=0&&nn>=0)nr.slice(1).forEach(r=>{
      const pid=f2p[r[ni]];if(!pid||!r[nn])return;
      const o=off[pid]||(off[pid]={zh:'',en:''});
      if(r[nl]===zhId)o.zh=r[nn];else if(r[nl]===enId)o.en=r[nn];
    });
  }catch(e){}
  const out=[];
  rows.forEach(r=>{
    if(r[iDef]==='1')return;
    const id=+r[iId],sp=+r[iSp],ident=r[iIdent],base=defIdent[sp],b=species[sp];
    if(!base||!b||!ident.startsWith(base+'-'))return;
    const toks=ident.slice(base.length+1).split('-');
    if(toks.some(t=>t==='totem'||t==='cap'))return;
    const k=toks.find(t=>PK_KW[t]);if(!k)return;
    const rest=toks.filter(t=>t!==k),xy=k==='mega'&&rest.length&&/^[xy]$/.test(rest[0])?rest.shift().toUpperCase():'';
    const note=rest.length?' ('+rest.join(' ')+')':'';
    const bz=b[1],be=b[2];
    let zh=bz?(k==='mega'?'Mega'+bz+xy:PK_KW[k][0]+bz)+note:'';
    const en=k==='mega'?'Mega '+be+(xy?' '+xy:'')+note:PK_KW[k][1]+' '+be+note;
    const alt=[];
    if(bz){
      if(k==='mega')alt.push('超級'+bz+xy,'超级'+bz+xy);
      if(k==='gmax')alt.push('超極巨'+bz,'極巨化'+bz);
      if(k==='primal')alt.push('原始'+bz);
    }
    const o=off[id];
    if(o&&o.zh)zh=o.zh;
    out.push([id,zh,(o&&o.en)||en,alt.join('|')]);
  });
  return out;
}
async function pkFetchList(){
  try{
    let zhId='4',enId='9';
    try{
      const rs=csvRows(await fetchAny(PK_CSV.map(b=>b+'languages.csv'))),h=rs[0]||[],ii=h.indexOf('id'),ij=h.indexOf('identifier');
      if(ii>=0&&ij>=0)rs.slice(1).forEach(r=>{if(r[ij]==='zh-Hant')zhId=r[ii];if(r[ij]==='en')enId=r[ii]});
    }catch(e){}
    const rs=csvRows(await fetchAny(PK_CSV.map(b=>b+'pokemon_species_names.csv'))),h=rs[0]||[];
    const iId=h.indexOf('pokemon_species_id'),iL=h.indexOf('local_language_id'),iN=h.indexOf('name');
    if(iId<0||iL<0||iN<0)throw new Error('format');
    const m={};
    rs.slice(1).forEach(r=>{
      const id=+r[iId];if(!id)return;
      const o=m[id]||(m[id]=[id,'','','']);
      if(r[iL]===zhId)o[1]=r[iN];else if(r[iL]===enId)o[2]=r[iN];
    });
    const arr=Object.values(m).sort((a,b)=>a[0]-b[0]);
    if(arr.length<100)throw new Error('short');
    let forms=[];
    try{forms=await pkFetchForms(m,zhId,enId)}catch(e){}   // 抓不到形態時，至少還有基本名單
    return arr.concat(forms.sort((a,b)=>a[0]-b[0]));
  }catch(e){
    // 備案：只有英文名
    const j=await fetchAny(['https://pokeapi.co/api/v2/pokemon-species?limit=3000'],'json');
    const arr=j.results.map(r=>[+r.url.replace(/\/$/,'').split('/').pop(),'',r.name,'']).filter(a=>a[0]);
    if(arr.length<100)throw new Error('short');
    return arr;
  }
}
function pkLoad(){
  if(PK.list)return Promise.resolve(PK.list);
  if(PK.loading)return PK.loading;
  PK.loading=(async()=>{
    let arr=null;
    if(IDB.db){try{const c=await IDB.get('pklist2');if(c&&c.v===2&&Array.isArray(c.arr)&&c.arr.length>100)arr=c.arr}catch(e){}}
    if(!arr){arr=await pkFetchList();if(IDB.db){try{await IDB.put({v:2,arr},'pklist2')}catch(e){}}}
    PK.list=arr.map(a=>({id:a[0],zh:a[1],en:a[2],alt:a[3]?a[3].split('|'):[]}));
    PK.map={};PK.list.forEach(e=>PK.map[e.id]=e);
    return PK.list;
  })();
  PK.loading.catch(()=>{PK.loading=null});
  return PK.loading;
}
const subseq=(str,q)=>{let i=0;for(const ch of str){if(ch===q[i])i++;if(i===q.length)return true}return false};
// 模糊搜尋：中文名、英文名、圖鑑編號；整個相符 > 開頭相符 > 包含 > 字不連續也行
function pkSearch(list,q){
  q=String(q||'').trim().toLowerCase().replace(/^#/,'').replace(/\s+/g,'');
  if(!q)return [];
  const qa=[...q],out=[];
  for(const e of list){
    let r=String(e.id)===q?0:9;
    for(const nm of [e.zh,e.en].concat(e.alt||[])){
      const t=String(nm||'').toLowerCase().replace(/\s+/g,'');
      if(!t)continue;
      const x=t===q?0:t.startsWith(q)?1:t.includes(q)?2:subseq([...t],qa)?3:9;
      if(x<r)r=x;
    }
    if(r<9)out.push({e,r});
  }
  out.sort((a,b)=>a.r-b.r||a.e.id-b.e.id);
  return out.slice(0,10).map(o=>o.e);
}
// 把官方插畫抓下來：裁掉透明邊、縮小，存成圖片資料
async function pkImageData(id,url){
  const blob=await fetchAny(url?[url].concat(PK_ART(id)):PK_ART(id),'blob');
  const obj=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=obj});
    const M=240,sc=Math.min(1,M/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    let x0=w,y0=h,x1=-1,y1=-1;
    try{
      const d=x.getImageData(0,0,w,h).data;
      for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)if(d[(yy*w+xx)*4+3]>10){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
    }catch(e){}
    if(x1<0)return c.toDataURL('image/png');
    const c2=document.createElement('canvas');c2.width=x1-x0+1;c2.height=y1-y0+1;
    c2.getContext('2d').drawImage(c,x0,y0,c2.width,c2.height,0,0,c2.width,c2.height);
    return c2.toDataURL('image/png');
  }finally{URL.revokeObjectURL(obj)}
}
// 取得單隻寶可夢的屬性與圖片（抓過的會存在手機裡）
async function pkInfo(id){
  if(PK.info[id])return PK.info[id];
  if(IDB.db){try{const c=await IDB.get('pk'+id);if(c&&c.types){PK.info[id]=c;return c}}catch(e){}}
  const j=await fetchAny(['https://pokeapi.co/api/v2/pokemon/'+id],'json');
  const types=(j.types||[]).slice().sort((a,b)=>a.slot-b.slot).map(t=>t.type.name).filter(k=>TMAP[k]);
  const art=j.sprites&&j.sprites.other&&j.sprites.other['official-artwork']&&j.sprites.other['official-artwork'].front_default;
  let photo='';
  try{photo=await pkImageData(id,art)}catch(e){}
  const info={id,types,photo};
  if(photo){PK.info[id]=info;if(IDB.db){try{await IDB.put(info,'pk'+id)}catch(e){}}}
  return info;
}
// 在輸入框下方顯示搜尋結果，點選後呼叫 onPick(寶可夢)
function attachPicker(input,box,onPick){
  let seq=0;
  input.addEventListener('input',async()=>{
    const q=input.value.trim(),my=++seq;
    if(!q){box.innerHTML='';return}
    if(!PK.list)box.innerHTML='<div class="pkmsg">載入寶可夢名單中…（第一次需要一點時間）</div>';
    let list;
    try{list=await pkLoad()}catch(e){if(my===seq)box.innerHTML='<div class="pkmsg">名單載入失敗，需要網路，請稍後再試</div>';return}
    if(my!==seq)return;
    const rs=pkSearch(list,q);
    box.innerHTML=rs.length?rs.map(e=>`<button type="button" class="pkrow" data-id="${e.id}"><span class="pkn">#${e.id}</span><span>${esc(e.zh||e.en)}</span><span class="pke">${esc(e.zh&&e.en?e.en:'')}</span></button>`).join(''):'<div class="pkmsg">找不到符合的寶可夢</div>';
  });
  box.addEventListener('click',e=>{
    const b=e.target.closest('.pkrow');if(!b)return;
    const en=PK.map&&PK.map[+b.dataset.id];if(!en)return;
    seq++;box.innerHTML='';onPick(en);
  });
}

const PLUS=(n,c)=>`<svg viewBox="0 0 24 24" width="${n}" height="${n}"><path d="M12 4v16M4 12h16" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const CHECK='<svg class="ck" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" fill="none" stroke="#35e04a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const num=v=>{const n=parseFloat(v);return isNaN(n)?-1:n};
const tcolor=k=>((TMAP[k]||TMAP.normal).c)+'d9';
function fuzzy(name,q){
  const qa=[...String(q||'').toLowerCase().replace(/\s+/g,'')];
  if(!qa.length)return true;
  const n=String(name||'').toLowerCase().replace(/\s+/g,'');
  if(n.includes(qa.join('')))return true;
  let i=0;
  for(const ch of n){if(ch===qa[i])i++;if(i===qa.length)return true}
  return false;
}

function ownHalf(x,label){

/* ================= 活動頁（甘特式月曆） ================= */
const CAL={y:new Date().getFullYear(),m:new Date().getMonth()};
const EV_COLORS=['#d9748a','#e08f4f','#f1d26a','#4fa87a','#3f9fb8','#5f82d6','#8f6fcf','#c569b0'];
const DAY=864e5;
function isLight(hex){const n=parseInt(hex.slice(1),16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))>185}
const pd=s=>{const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])};
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const md=s=>{const a=s.split('-').map(Number);return a[1]+'/'+a[2]};
function dateText(e){
  const a=e.start.split('-').map(Number),b=e.end.split('-').map(Number);
  if(e.start===e.end)return a[1]+'/'+a[2];
  if(a[0]===b[0]&&a[1]===b[1])return a[1]+'/'+a[2]+'-'+b[2];
  return a[1]+'/'+a[2]+'-'+b[1]+'/'+b[2];
}
function timeText(e){
  const s=e.sTime||'',t=e.eTime||'';
  if(!s&&!t)return '';
  const end=(t==='00:00'&&s&&s!=='00:00')?'24:00':t;
  return s&&end?s+'-'+end:(s||end);
}
function evLines(e){
  const tt=timeText(e);
  return `<div class="evL1">${dateText(e)}${tt?' '+tt:''}</div>${e.mon?`<div class="evL">${esc(e.mon)}</div>`:''}${e.text?`<div class="evL">${esc(e.text)}</div>`:''}`;
}
// 活動結束時間（本地時間）。沒填結束時間就算到當天結束；結束 00:00 且開始不是 00:00 視為 24:00
function endStamp(e){
  const a=e.end.split('-').map(Number),t=e.eTime||'';
  if(!t||(t==='00:00'&&e.sTime&&e.sTime!=='00:00'))return new Date(a[0],a[1]-1,a[2]+1).getTime();
  const h=t.split(':').map(Number);
  return new Date(a[0],a[1]-1,a[2],h[0],h[1]).getTime();
}
const isExpired=(e,now)=>endStamp(e)<=(now||Date.now());
// 未過期的在前（依開始日期），過期的排到最後
function orderEvents(arr){
  const now=Date.now(),by=(a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.end<b.end?-1:a.end>b.end?1:0);
  return arr.filter(e=>!isExpired(e,now)).sort(by).concat(arr.filter(e=>isExpired(e,now)).sort(by));
}

    box.innerHTML='<div class="evL1">還沒有活動</div><div class="evL">點這裡新增</div>';
  }else{
    box.className=isLight(e.color)?'lt':'';

// 每天隨機一隻（每輪 n 天各出現一次，連續兩天不會重複）
const MONS=['mons/01.png'];   // 之後把你畫的 PNG 放進 mons 資料夾，並把檔名加在這裡
function monIndex(n){
  if(n<2)return 0;
  const d=new Date(),day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  const perm=c=>{const r=rng(c*104729+n*31+7),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const c=Math.floor(day/n),pos=day-c*n,a=perm(c);
  if(a[0]===perm(c-1)[n-1])[a[0],a[1]]=[a[1],a[0]];
  return a[pos];
}
// 版面：寶可夢對齊「Po」，活動框對齊「keLog」，兩者之間留一點空隙；垂直放在草地偏上的位置
function placeHome(){
  const t=$('#ttl'),o=$('#homeEv'),m=$('#homeMon'),h=$('#home');
  if(!t||!o||current!=='home')return;
  const hr=h.getBoundingClientRect(),W=h.clientWidth||window.innerWidth,H=h.clientHeight||window.innerHeight;
  const sc=Math.max(W/1000,H/2062),y=(H-2062*sc)/2+2062*sc*0.835;
  const po=$('#tPo').getBoundingClientRect(),ke=$('#tKe').getBoundingClientRect(),gap=9,sp=8;
  const hasMon=m.classList.contains('on');
  const ox=hasMon?ke.left-hr.left+gap:t.getBoundingClientRect().left-hr.left;
  const ow=hasMon?ke.width-gap-1:t.getBoundingClientRect().width;
  o.style.left=Math.round(ox)+'px';o.style.width=Math.round(ow)+'px';o.style.top=Math.round(y)+'px';o.style.transform='translateY(-50%)';
  if(hasMon){
    const ml=Math.round(po.left-hr.left);m.style.left=ml+'px';m.style.width=(Math.round(ox)-sp-ml)+'px';
    m.style.height=o.offsetHeight+'px';m.style.top=Math.round(y)+'px';
    // 左右留白一致：活動框右側到畫面邊緣 = 寶可夢左側到畫面邊緣
    const il=$('#homeMonImg').getBoundingClientRect().left-hr.left;
    if($('#homeMonImg').getBoundingClientRect().width>0&&il>0){
      o.style.width=Math.max(120,Math.round(W-il-Math.round(ox)))+'px';
      m.style.height=o.offsetHeight+'px';
    }
  }
}

function renderCalendar(root,p){
  p=p||PAGES.find(x=>x.id==='events');
  const first=Date.UTC(CAL.y,CAL.m,1),dim=new Date(Date.UTC(CAL.y,CAL.m+1,0)).getUTCDate();
  const off=new Date(first).getUTCDay(),weeks=Math.ceil((off+dim)/7),gs=first-off*DAY;
  const evs=DB.events.slice().sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(pd(b.end)-pd(b.start))-(pd(a.end)-pd(a.start)));
  const today=todayStr();
  let grid='';
  for(let w=0;w<weeks;w++){
    const ws=gs+w*7*DAY,wsS=iso(ws),weS=iso(ws+6*DAY);
    let cells='';
    for(let i=0;i<7;i++){
      const ms=ws+i*DAY,s=iso(ms),inM=new Date(ms).getUTCMonth()===CAL.m;
      cells+=`<div class="dn${inM?'':' out'}" style="grid-column:${i+1}"><span class="${s===today?'today':''}">${new Date(ms).getUTCDate()}</span></div>`;
    }
    const lanes=[];let bars='';
    evs.filter(e=>e.start<=weS&&e.end>=wsS).forEach(e=>{
      const sc=Math.max(0,Math.round((pd(e.start)-ws)/DAY)),ec=Math.min(6,Math.round((pd(e.end)-ws)/DAY));
      let l=lanes.findIndex(last=>last<sc);
      if(l<0){l=lanes.length;lanes.push(-1)}
      lanes[l]=ec;
      const cls='bar'+(e.start>=wsS?' s':'')+(e.end<=weS?' e':'');
      bars+=`<div class="${cls}" style="grid-column:${sc+1}/${ec+2};grid-row:${l+2};background:${e.color}"></div>`;
    });
    grid+=`<div class="wkRow">${cells}${bars}</div>`;
  }
  const ms0=iso(first),ms1=iso(first+(dim-1)*DAY);
  const list=orderEvents(evs.filter(e=>e.start<=ms1&&e.end>=ms0));
  const nowT=Date.now();
  const cards=list.map(e=>`<div class="evCard${isLight(e.color)?' lt':''}" style="--c:${isExpired(e,nowT)?rgba(e.color,.5):e.color}" data-act="evEdit" data-id="${e.id}">
      ${e.photo?`<div class="evPh"><img src="${e.photo}" alt=""></div>`:''}
      <div class="evTx">${evLines(e)}</div>
    </div>`).join('')||'<div class="empty">這個月沒有活動</div>';
  root.innerHTML=`<div class="head"><h2>${esc(p.title)}</h2><button class="addBtn" data-act="evAdd" aria-label="新增活動"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
    <div class="evTop"><div class="cal">
      <div class="calHead"><button class="calBtn" data-act="calPrev" aria-label="上個月">‹</button><b>${CAL.y} 年 ${CAL.m+1} 月</b><button class="calBtn" data-act="calNext" aria-label="下個月">›</button></div>
      <div class="wkHead">${['日','一','二','三','四','五','六'].map(w=>`<div>${w}</div>`).join('')}</div>
      ${grid}</div></div>
    <div class="list evCards">${cards}</div>`;
}

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const M=220,s=Math.min(1,M/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const png=/png|webp|gif/.test(file.type);
        res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function typeOpts(sel){
  return TYPES.map(t=>`<option value="${t.k}"${t.k===sel?' selected':''}>${t.n}</option>`).join('');
}
function openEdit(id){
  const mode=UI.mode,isMax=mode==='max';
  const old=id?DB[mode].find(x=>x.id===id):null;
  const d=old||(isMax
    ?{kind:'atk',name:'',photo:'',t1:'normal',form:'極巨化',value:'',owned:false,hp:'',atk:'',def:''}
    :{name:'',photo:'',t1:'normal',t2:'',fast:'',charged:'',dps:'',owned:false,hp:'',atk:'',def:''});
  let photo=d.photo||'',kind=d.kind==='tank'?'tank':'atk';
  const seg=isMax?`<div class="seg" id="seg"><button type="button" data-k="atk" class="${kind==='atk'?'on':''}">打手</button><button type="button" data-k="tank" class="${kind==='tank'?'on':''}">坦克</button></div>`:'';
  const specific=isMax
    ?`<label class="f"><span>形態</span><select id="fForm"><option value="極巨化"${d.form!=='超極巨化'?' selected':''}>極巨化</option><option value="超極巨化"${d.form==='超極巨化'?' selected':''}>超極巨化</option></select></label>
      <label class="f"><span id="valLbl">${kind==='atk'?'打手':'坦克'}數值</span><input id="fValue" type="number" step="any" inputmode="decimal" value="${esc(d.value)}"></label>`
    :`<div class="f2">
        <label class="f"><span>小招</span><input id="fFast" value="${esc(d.fast)}" autocomplete="off"></label>
        <label class="f"><span>大招</span><input id="fCharged" value="${esc(d.charged)}" autocomplete="off"></label>
      </div>
      <label class="f"><span>DPS</span><input id="fDps" type="number" step="any" inputmode="decimal" value="${esc(d.dps)}"></label>`;
  const s=openSheet(`
    <h3>${old?'編輯寶可夢':'新增寶可夢'}</h3>
    ${seg}
    <div class="f"><span>從 PokeAPI 搜尋（可不用，打名字、英文或編號）</span><input id="pkIn" type="search" placeholder="例如：烈空、ray、384" autocomplete="off" autocapitalize="off"><div id="pkRes" class="pkRes"></div><div id="pkSt" class="pkSt"></div></div>
    <div class="photoPick"><div class="pv" id="pv">${photo?`<img src="${photo}" alt="">`:'無照片'}</div>
      <button class="btn" id="pickBtn" type="button">選擇照片</button><input type="file" id="photoIn" accept="image/*" hidden></div>
    <label class="f"><span>名字</span><input id="fName" value="${esc(d.name)}" autocomplete="off"></label>
    <label class="f"><span>屬性</span><select id="fT1">${typeOpts(d.t1)}</select></label>
    ${specific}
    <label class="chk"><input type="checkbox" id="fOwned"${d.owned?' checked':''}> 我有這隻</label>
    <div class="f3">
      <label class="f"><span>HP</span><input id="fHp" type="number" inputmode="numeric" value="${esc(d.hp)}"></label>
      <label class="f"><span>攻擊</span><input id="fAtk" type="number" inputmode="numeric" value="${esc(d.atk)}"></label>
      <label class="f"><span>防禦</span><input id="fDef" type="number" inputmode="numeric" value="${esc(d.def)}"></label>
    </div>
    <div class="btns">${old?'<button class="btn del" id="delBtn">刪除</button>':''}<button class="btn" id="cancelBtn">取消</button><button class="btn main" id="saveBtn">儲存</button></div>`);
  const q=x=>s.querySelector(x);
  if(isMax)q('#seg').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    kind=b.dataset.k;
    s.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
    q('#valLbl').textContent=(kind==='atk'?'打手':'坦克')+'數值';
  };
  attachPicker(q('#pkIn'),q('#pkRes'),async en=>{
    const st=q('#pkSt');st.textContent='載入「'+(en.zh||en.en)+'」中…';
    try{
      const info=await pkInfo(en.id);
      q('#fName').value=en.zh||en.en;
      if(info.types[0])q('#fT1').value=info.types[0];
      if(info.photo){photo=info.photo;q('#pv').innerHTML=`<img src="${photo}" alt="">`;st.textContent='已自動填入名字、屬性和圖片'}
      else st.textContent='已填入名字和屬性，圖片抓取失敗，請手動上傳';
      q('#pkIn').value='';
    }catch(err){st.textContent='抓取失敗（需要網路），請稍後再試，或手動輸入'}
  });
  q('#pickBtn').onclick=()=>q('#photoIn').click();
  q('#photoIn').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{photo=await readImage(f);q('#pv').innerHTML=`<img src="${photo}" alt="">`}catch(err){alert('照片讀取失敗')}
  };
  q('#cancelBtn').onclick=closeSheet;
  if(old)q('#delBtn').onclick=()=>{if(confirm('確定刪除「'+(old.name||'這隻')+'」？')){DB[mode]=DB[mode].filter(x=>x.id!==old.id);save();closeSheet();renderRank($('#page'))}};
  q('#saveBtn').onclick=()=>{
    const name=q('#fName').value.trim();
    if(!name&&!photo){alert('請至少填名字或選一張照片');return}
    const base={
      id:old?old.id:uid(),name,photo,t1:q('#fT1').value,
      owned:q('#fOwned').checked,hp:q('#fHp').value.trim(),atk:q('#fAtk').value.trim(),def:q('#fDef').value.trim()
    };
    const rec=isMax
      ?Object.assign(base,{kind,form:q('#fForm').value,value:q('#fValue').value.trim()})
      :Object.assign(base,{t2:old?(old.t2||''):'',fast:q('#fFast').value.trim(),charged:q('#fCharged').value.trim(),dps:q('#fDps').value.trim()});
    const arr=DB[mode];
    if(old)arr[arr.findIndex(x=>x.id===old.id)]=rec;else arr.push(rec);
    save();closeSheet();renderRank($('#page'));
  };
}

/* ---- 快速設定「我有這隻」 ---- */
function openOwn(id){
  const p=DB[UI.mode].find(x=>x.id===id);if(!p)return;
  const role=UI.mode==='max'?(p.kind==='tank'?'（坦克）':'（打手）'):'';
  const s=openSheet(`
    <h3>${(esc(p.name)||'這隻寶可夢')+role}</h3>
    <div class="f3">
      <label class="f"><span>HP</span><input id="oHp" type="number" inputmode="numeric" value="${esc(p.hp)}"></label>
      <label class="f"><span>攻擊</span><input id="oAtk" type="number" inputmode="numeric" value="${esc(p.atk)}"></label>
      <label class="f"><span>防禦</span><input id="oDef" type="number" inputmode="numeric" value="${esc(p.def)}"></label>
    </div>
    <div class="btns">${p.owned?'<button class="btn del" id="noBtn">我沒有</button>':''}<button class="btn" id="cBtn">取消</button><button class="btn main" id="okBtn">我有這隻</button></div>`);
  const q=x=>s.querySelector(x);

}

/* ================= 屬性表 ================= */
// 攻擊時「效果絕佳」的對象
const T_STRONG={
 normal:[],fire:['grass','ice','bug','steel'],water:['fire','ground','rock'],electric:['water','flying'],
 grass:['water','ground','rock'],ice:['grass','ground','flying','dragon'],fighting:['normal','ice','rock','dark','steel'],
 poison:['grass','fairy'],ground:['fire','electric','poison','rock','steel'],flying:['grass','fighting','bug'],
 psychic:['fighting','poison'],bug:['grass','psychic','dark'],rock:['fire','ice','flying','bug'],
 ghost:['psychic','ghost'],dragon:['dragon'],dark:['psychic','ghost'],steel:['ice','rock','fairy'],
 fairy:['fighting','dragon','dark']
};
// 防守時能抵抗（受到的傷害減少，含無效）的屬性
const T_RESIST={
 normal:['ghost'],fire:['fire','grass','ice','bug','steel','fairy'],water:['fire','water','ice','steel'],
 electric:['electric','flying','steel'],grass:['water','electric','grass','ground'],ice:['ice'],
 fighting:['bug','rock','dark'],poison:['grass','fighting','poison','bug','fairy'],ground:['poison','rock','electric'],
 flying:['grass','fighting','bug','ground'],psychic:['fighting','psychic'],bug:['grass','fighting','ground'],
 rock:['normal','fire','poison','flying'],ghost:['poison','bug','normal','fighting'],dragon:['fire','water','electric','grass'],
 dark:['ghost','dark','psychic'],steel:['normal','grass','ice','flying','psychic','bug','rock','dragon','steel','fairy','poison'],
 fairy:['fighting','bug','dark','dragon']
};
// 被克制 = 哪些屬性攻擊它時效果絕佳（由「克制」反推）
const T_WEAK={};
TYPES.forEach(t=>T_WEAK[t.k]=[]);
TYPES.forEach(a=>(T_STRONG[a.k]||[]).forEach(d=>T_WEAK[d].push(a.k)));
UI.tf=[];UI.tmon=null;
function tfLabel(){return UI.tmon?UI.tmon.name:UI.tf.length?UI.tf.map(k=>TMAP[k].n).join('、'):'屬性篩選'}
function renderTypes(root,p){
  p=p||PAGES.find(x=>x.id==='types');
  const sel=UI.tf,on=sel.length>0||!!UI.tmon;
  const pill=k=>`<span class="tp${sel.includes(k)?' hit':''}" style="background:${TMAP[k].c}">${TMAP[k].n}</span>`;
  const col=arr=>`<div class="tcell tlist">${(arr||[]).map(pill).join('')||'<span class="tnone">—</span>'}</div>`;
  const shown=TYPES.filter(t=>!sel.length||sel.includes(t.k)||[T_STRONG[t.k],T_RESIST[t.k],T_WEAK[t.k]].some(a=>(a||[]).some(k=>sel.includes(k))));
  const rows=shown.map(t=>`<div class="trow">
    <div class="tcell tname" style="--c:${t.c}d9">${typeIcon(t.k)}<span>${t.n}</span></div>
    ${col(T_STRONG[t.k])}${col(T_RESIST[t.k])}${col(T_WEAK[t.k])}
  </div>`).join('');
  const thumb=UI.tmon&&UI.tmon.photo?`<img class="monThumb" src="${UI.tmon.photo}" alt="">`:'';
  root.innerHTML=`<div class="head"><h2>${esc(p.title)}</h2>${thumb}<div class="modeBox"><select id="tfSel" aria-label="篩選方式"><option value="" selected disabled hidden>${esc(tfLabel())}</option><option value="type">屬性篩選</option><option value="mon">寶可夢篩選</option>${on?'<option value="clear">清除篩選</option>':''}</select></div></div>
    <div class="thwrap"><div class="trow thead"><div>屬性</div><div>克制</div><div>抵抗</div><div>被克制</div></div></div>
    <div class="list tlistbox">${rows}</div>`;
}
function refreshTypes(){const l=$('#page .list'),st=l?l.scrollTop:0;renderTypes($('#page'));const l2=$('#page .list');if(l2)l2.scrollTop=st}
function openTypeFilter(){
  const s=openSheet(`<h3>屬性篩選</h3>
    <p class="note">最多選兩個屬性。只要這個屬性出現在某一列的任何一欄，那一列就會顯示。</p>
    <div class="chips" id="tfChips" style="padding:0 0 12px"></div>
    <div class="btns"><button class="btn" id="tfClear">清除</button><button class="btn main" id="tfDone">完成</button></div>`);
  const box=s.querySelector('#tfChips');
  const draw=()=>{
    box.classList.toggle('filtering',UI.tf.length>0);
    box.innerHTML=TYPES.map(t=>`<button class="chip${UI.tf.includes(t.k)?' sel':''}" style="background:${t.c}" data-k="${t.k}">${typeIcon(t.k)}<span>${t.n}</span></button>`).join('');
  };
  draw();
  box.onclick=e=>{
    const b=e.target.closest('.chip');if(!b)return;
    const k=b.dataset.k,i=UI.tf.indexOf(k);
    if(i>=0)UI.tf.splice(i,1);
    else if(UI.tf.length>=2){alert('最多只能選兩個屬性');return}
    else UI.tf.push(k);
    UI.tmon=null;draw();refreshTypes();
  };
  s.querySelector('#tfClear').onclick=()=>{UI.tf=[];UI.tmon=null;draw();refreshTypes()};
  s.querySelector('#tfDone').onclick=closeSheet;
}
function openMonFilter(){
  const s=openSheet(`<h3>寶可夢篩選</h3>
    <p class="note">搜尋寶可夢（可打中文、英文或編號，字不連續也找得到），會自動篩選牠的屬性。</p>
    <div class="f"><input id="mfIn" type="search" placeholder="例如：烈空、ray、384" autocomplete="off" autocapitalize="off"><div id="mfRes" class="pkRes"></div><div id="mfSt" class="pkSt"></div></div>
    <div class="btns"><button class="btn" id="mfClose">關閉</button></div>`,{top:true});
  const q=x=>s.querySelector(x);
  attachPicker(q('#mfIn'),q('#mfRes'),async en=>{
    const st=q('#mfSt');st.textContent='載入「'+(en.zh||en.en)+'」中…';
    try{
      const info=await pkInfo(en.id);
      if(!info.types.length){st.textContent='查不到這隻的屬性';return}
      UI.tmon={id:en.id,name:en.zh||en.en,photo:info.photo};UI.tf=info.types.slice(0,2);
      closeSheet();refreshTypes();
    }catch(err){st.textContent='抓取失敗（需要網路），請稍後再試'}
  });
  q('#mfClose').onclick=closeSheet;
  q('#mfIn').focus();
}

/* ================= 雲朵備份 ================= */
function openBackup(){
  const s=openSheet(`
    <h3>雲朵備份</h3>
    <p class="note">目前資料：團體戰 ${DB.team.length} 筆、極巨戰 ${DB.max.length} 筆、活動 ${DB.events.length} 筆。<br>資料存在這支手機的瀏覽器裡，換手機或清除網站資料前，請先匯出備份。</p>
    <div class="btns"><button class="btn main" id="exBtn">匯出備份</button><button class="btn" id="imBtn">匯入備份</button></div>
    <div class="btns"><button class="btn" id="bClose">關閉</button></div>`);
  s.querySelector('#exBtn').onclick=exportData;
  s.querySelector('#imBtn').onclick=()=>$('#importFile').click();
  s.querySelector('#bClose').onclick=closeSheet;
}
async function exportData(){
  const text=JSON.stringify({app:'PokeLog',version:1,exportedAt:new Date().toISOString(),data:DB});
  const blob=new Blob([text],{type:'application/json'});
  const name='PokeLog-backup-'+todayStr()+'.json';
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'PokeLog 備份'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const j=JSON.parse(fr.result);
      const d=j&&j.data?j.data:j;
      if(!d||!Array.isArray(d.team))throw new Error('format');
      if(!confirm('匯入會取代目前的資料（團體戰 '+d.team.length+' 筆），確定嗎？'))return;
      DB={team:d.team,max:Array.isArray(d.max)?d.max:[],events:Array.isArray(d.events)?d.events:[]};
      save();closeSheet();
      if(current!=='home'){const p=PAGES.find(x=>x.id===current);p.render($('#page'),p)}
      alert('匯入完成');
    }catch(err){alert('這個檔案不是 PokeLog 的備份')}
  };
  fr.readAsText(f);
});

/* ================= 啟動 ================= */
applyBall();
go('home');
initDB().then(()=>{if(current!=='home'){const p=PAGES.find(x=>x.id===current);p.render($('#page'),p)}else renderHome()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ballDay!==todayStr())applyBall();if(current==='home')renderHome()}});
})();
</script>
